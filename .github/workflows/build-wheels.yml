name: build-wheels

# Candidate-only workflow on candidate/tilelang-role-3dff66ef.
#
# Build exactly the TileLang/tvm-ffi pair from the native role-classification
# and dependent shared-RMW planning fixes, then overlay it onto the immutable
# production wheel release. The resulting complete prerelease remains bound
# to this candidate cppmega commit and must not be promoted to main/STACK.lock
# before the H200 gates.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - STACK.lock
      - upstream_prs/*.patch
      - .github/workflows/build-wheels.yml

permissions:
  contents: write   # needed to create the Release that holds the wheel assets

concurrency:
  # Cancel any in-flight build-wheels run when a new one is queued — two
  # parallel matrix runs (7 jobs each) compete for the runner pool and
  # GitHub starts SIGTERM-ing long-running jobs (flash_attn) at exit 143.
  group: build-wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VERSION: "13.2.1"
  CUDA_TOOLKIT_DEB_VERSION: "13.2.1-1"
  PYTHON_VERSION: "3.13"
  # Keep exact: C++ extension wheels, especially TransformerEngine, are ABI
  # tied to the precise stable CUDA torch wheel they were compiled against.
  TORCH_VERSION: "2.13.0+cu132"
  TORCH_INDEX: "https://download.pytorch.org/whl/cu132"
  TORCH_CUDNN_VERSION: "9.20.0.48"
  TORCH_NCCL_VERSION: "2.29.7"
  TORCH_CUDA_ARCH_LIST: "9.0;10.0;12.1"

jobs:
  resolve:
    if: github.repository == 'DatasunriseOU/cppmega'
    runs-on: [self-hosted, Linux, X64, cppmega]
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  build:
    if: github.repository == 'DatasunriseOU/cppmega'
    needs: [resolve]
    runs-on: [self-hosted, Linux, X64, cppmega]
    timeout-minutes: 350     # 6h hard limit; flash_attn at MAX_JOBS=1 ~= 4h
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tilelang
            # DatasunriseOU/tilelang fork (not upstream tile-ai/tilelang) because:
            #   - 11848a44 carries upstream PR #2071 (removes apache-tvm-ffi<0.1.10 cap)
            #     and links TVM's CUDA driver calls, including cuFuncGetAttribute,
            #     to TileLang's lazy stub
            #   - vendored TVM submodule (DatasunriseOU/tvm@e25ca6ae) includes
            #     apache/tvm#18938 (TVMDerivedObject.__slots__ fix) → no
            #     '_NestedLoopCheckVisitor' import crash under tvm-ffi >=0.1.12
            #   - vendored tvm-ffi is v0.1.13.post5: official v0.1.13 plus the
            #     compatibility seams required by this TVM/TileLang fork
            #   - the same TVM pin restores nvbench/l2_cache_flush.h, which
            #     TileLang's CUDA runtime still compiles.
            #   - the TVM pin adapts AdjustMatmulOrder's axes to this fork's
            #     boxed-Integer permute_dims API.
            #   - TVM imports its pytest-backed testing helpers lazily, keeping
            #     pytest out of the production import path.
            #   - TVM preserves AttrStmt(node=None), preventing Mamba
            #     T.use_swizzle purity-analysis SIGSEGVs.
            #   - TileLang restores special-scope CUDA declarations for TIRx
            #     AllocBuffer nodes (WGMMA descriptors and local.var scalars).
            #   - upstream tile-ai/tilelang HEAD still caps apache-tvm-ffi<0.1.12,
            #     incompatible with FA4 beta23's >=0.1.12 floor.
            # Candidate-only override. Do not copy to STACK.lock before H200
            # stage2+GQA and the exact three Mamba tests pass.
            repo: DatasunriseOU/tilelang
            ref: a951e3c8a4e2e1092579939d6bc31631ee1a4d8f
            submodules: "true"
            extra_env: ""

    steps:
      - name: Checkout cppmega (for patches)
        uses: actions/checkout@v4

      - name: Verify persistent runner capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          minimum_kib=$((120 * 1024 * 1024))
          if (( available_kib < minimum_kib )); then
            echo "::error::CUDA wheel build requires at least 120 GiB free on the persistent runner"
            exit 1
          fi

      - name: Resolve source SHA
        id: src
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ matrix.repo }}.git"
          REF="${{ matrix.ref }}"
          SHA=$(git ls-remote "$REPO_URL" "${REF}^{}" | awk 'NR == 1 {print $1}')
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote "$REPO_URL" "$REF" | awk 'NR == 1 {print $1}')
          fi
          if [ -z "$SHA" ] && [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            SHA="$REF"
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unable to resolve ${{ matrix.repo }}@$REF to an exact commit"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ matrix.repo }}@$REF → $SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install gcc-15 + ccache (vendored debs)
        # We pulled gcc-15 .debs from Ubuntu questing (25.10) main archive
        # once and uploaded them as a release asset on this repo. This avoids
        # the chronically flaky Launchpad PPA (api.launchpad.net + ppa.launchpad
        # content.net both regularly time out / return 503 from CI runners,
        # blocking every wheel build for hours).
        # Source: archive.ubuntu.com/ubuntu/pool/main/g/gcc-15/ (15.2.0-4ubuntu4)
        # Release: github.com/${{ github.repository }}/releases/tag/${TOOLCHAIN_TAG}
        env:
          TOOLCHAIN_TAG: toolchain-gcc-15-15.2.0-4ubuntu4
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          toolchain_dir="$RUNNER_TEMP/gcc15"
          rm -rf "$toolchain_dir"
          mkdir -p "$toolchain_dir"
          cd "$toolchain_dir"
          # Download from our own release (GitHub's CDN, very stable). One blob,
          # no PPA, no add-apt-repository, no Launchpad anywhere in the path.
          if ! gh release download "$TOOLCHAIN_TAG" \
              --repo "${{ github.repository }}" \
              --pattern 'gcc-15-noble-amd64.tar.gz'; then
            echo "::warning::vendored gcc-15 release missing in ${{ github.repository }}; falling back to ubuntu-toolchain PPA"
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get install -y software-properties-common
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get install -y gcc-15 g++-15 ccache ninja-build
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 150 \
              --slave /usr/bin/g++ g++ /usr/bin/g++-15
            sudo update-alternatives --set gcc /usr/bin/gcc-15
            test "$(readlink -f /usr/bin/gcc)" = "$(readlink -f /usr/bin/gcc-15)"
            test "$(readlink -f /usr/bin/g++)" = "$(readlink -f /usr/bin/g++-15)"
            gcc --version
            g++ --version
            exit 0
          fi
          tar xzf gcc-15-noble-amd64.tar.gz
          sha256sum -c SHA256SUMS
          # Install ccache + ninja from noble main (no PPA needed for these).
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get install -y ccache ninja-build
          # dpkg -i everything in one shot (dpkg topo-sorts internally). The
          # tarball includes both the compiler binaries and all gcc-15 runtime
          # libs (libgcc-s1, libstdc++6, libquadmath0, libgomp1, libasan8,
          # liblsan0, libtsan2, libubsan1, libitm1, libatomic1, libhwasan0,
          # libcc1-0) — these MUST be upgraded together because libgcc-15-dev
          # has internal version-locked deps on every one of them. Other deps
          # (libgmp10, libisl23, libmpc3, libmpfr6, libzstd1, zlib1g, binutils)
          # are already in noble main and noble's versions are new enough.
          sudo dpkg -i *.deb
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 150 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-15
          sudo update-alternatives --set gcc /usr/bin/gcc-15
          test "$(readlink -f /usr/bin/gcc)" = "$(readlink -f /usr/bin/gcc-15)"
          test "$(readlink -f /usr/bin/g++)" = "$(readlink -f /usr/bin/g++-15)"
          gcc --version
          g++ --version

      - name: Install CUDA ${{ env.CUDA_VERSION }} (apt from NVIDIA repo)
        run: |
          set -euo pipefail
          keyring_deb="$RUNNER_TEMP/cuda-keyring_1.1-1_all.deb"
          wget -qO "$keyring_deb" \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i "$keyring_deb"
          sudo apt-get -o Acquire::Retries=5 update
          # cuDNN 9 permits only one system CUDA variant at a time. Do not
          # replace a persistent runner's CUDA-12 cuDNN packages. The exact
          # CUDA-13 cuDNN/NCCL pair required by torch is installed by pip below
          # and exported from site-packages for TransformerEngine's build.
          sudo apt-get install -y --no-install-recommends \
            "cuda-toolkit-13-2=${CUDA_TOOLKIT_DEB_VERSION}"
          echo "CUDA_HOME=/usr/local/cuda-13.2" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-13.2/bin" >> "$GITHUB_PATH"
          nvcc_version=$(/usr/local/cuda-13.2/bin/nvcc --version)
          echo "$nvcc_version"
          grep -q 'release 13\.2' <<<"$nvcc_version"
          # Keep real driver libraries intact on persistent GPU runners. Add
          # toolkit stubs only when the host has no driver library at all.
          if ! ldconfig -p | grep -q 'libcuda\.so\.1'; then
            sudo ln -sf /usr/local/cuda-13.2/lib64/stubs/libcuda.so /usr/local/cuda-13.2/lib64/libcuda.so
            sudo ln -sf /usr/local/cuda-13.2/lib64/stubs/libcuda.so /usr/local/cuda-13.2/lib64/libcuda.so.1
          fi
          if ! ldconfig -p | grep -q 'libnvidia-ml\.so\.1'; then
            sudo ln -sf /usr/local/cuda-13.2/lib64/stubs/libnvidia-ml.so /usr/local/cuda-13.2/lib64/libnvidia-ml.so
            sudo ln -sf /usr/local/cuda-13.2/lib64/stubs/libnvidia-ml.so /usr/local/cuda-13.2/lib64/libnvidia-ml.so.1
          fi

      - name: Wire ccache as gcc/g++/nvcc via PATH
        # CC="ccache gcc-15" breaks setuptools/ninja (it splits the value and
        # treats "gcc-15" as a positional arg). Use PATH-based wrappers instead:
        # /usr/lib/ccache/<tool> -> ccache; ccache then exec's the real binary.
        run: |
          sudo mkdir -p /usr/lib/ccache
          for tool in cc gcc g++ c++ gcc-15 g++-15 gcc-14 g++-14 nvcc; do
            sudo ln -sf /usr/bin/ccache /usr/lib/ccache/$tool
          done
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Configure nvcc → gcc-15
        run: |
          echo "NVCC_PREPEND_FLAGS=--compiler-bindir=/usr/bin/g++-15 --allow-unsupported-compiler" >> "$GITHUB_ENV"
          # Per-matrix arch_override wins over the global TORCH_CUDA_ARCH_LIST
          # (e.g. flash_attn_3 hopper-only sm_90, no 10.0/12.1).
          ARCH="${{ matrix.arch_override || env.TORCH_CUDA_ARCH_LIST }}"
          echo "TORCH_CUDA_ARCH_LIST=${ARCH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-13.2/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "Using TORCH_CUDA_ARCH_LIST=${ARCH}"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.name }}-${{ steps.src.outputs.sha }}-cuda${{ env.CUDA_VERSION }}-torch${{ env.TORCH_VERSION }}
          restore-keys: |
            ccache-${{ matrix.name }}-

      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -o compiler_check=content
          ccache -z

      - name: Install torch ${{ env.TORCH_VERSION }}
        # download.pytorch.org sometimes drops the connection mid-stream on
        # the big CUDA wheels (IncompleteRead on nvidia_cublas-*.whl, ~400 MB).
        # --retries 10 + --timeout 60 makes pip retry the whole package on
        # ProtocolError. Wrap in a shell loop too in case pip exits before retrying.
        run: |
          set -euo pipefail
          pip install --upgrade pip setuptools wheel
          n=0; until pip install --retries 10 --timeout 60 \
                       --extra-index-url ${{ env.TORCH_INDEX }} \
                       "torch==${{ env.TORCH_VERSION }}"; do
            n=$((n+1))
            [ "$n" -ge 5 ] && { echo "::error::torch install failed after 5 attempts"; exit 1; }
            echo "::warning::torch install attempt $n failed; retrying in $((30*n))s"
            sleep $((30 * n))
          done
          python - <<'PY'
          from importlib import metadata
          from importlib.util import find_spec
          from pathlib import Path
          import os
          import torch

          expected = {
              "torch": os.environ["TORCH_VERSION"],
              "nvidia-cudnn-cu13": os.environ["TORCH_CUDNN_VERSION"],
              "nvidia-nccl-cu13": os.environ["TORCH_NCCL_VERSION"],
          }
          observed = {
              "torch": str(torch.__version__),
              "nvidia-cudnn-cu13": metadata.version("nvidia-cudnn-cu13"),
              "nvidia-nccl-cu13": metadata.version("nvidia-nccl-cu13"),
          }
          if observed != expected:
              raise SystemExit(
                  f"torch CUDA dependency contract drifted: "
                  f"observed={observed!r} expected={expected!r}"
              )
          if torch.version.cuda != "13.2":
              raise SystemExit(
                  f"torch CUDA build drifted: observed={torch.version.cuda!r} "
                  "expected='13.2'"
              )
          def resolve_package_root(module: str) -> Path:
              spec = find_spec(module)
              locations = list(spec.submodule_search_locations or ()) if spec else []
              if len(locations) != 1:
                  raise SystemExit(
                      f"unable to resolve {module} root: {locations!r}"
                  )
              return Path(locations[0]).resolve()

          cudnn_path = resolve_package_root("nvidia.cudnn")
          if not (cudnn_path / "include/cudnn.h").is_file():
              raise SystemExit(f"cuDNN header is missing below {cudnn_path}")
          if not any((cudnn_path / "lib").glob("libcudnn.so.9*")):
              raise SystemExit(f"cuDNN runtime is missing below {cudnn_path}")
          nccl_path = resolve_package_root("nvidia.nccl")
          if not (nccl_path / "include/nccl.h").is_file():
              raise SystemExit(f"NCCL header is missing below {nccl_path}")
          if not any((nccl_path / "lib").glob("libnccl.so.2*")):
              raise SystemExit(f"NCCL runtime is missing below {nccl_path}")
          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a", encoding="utf-8") as stream:
              stream.write(f"CUDNN_PATH={cudnn_path}\n")
              stream.write(f"NCCL_PATH={nccl_path}\n")
              stream.write(
                  f"CPATH={nccl_path / 'include'}:"
                  f"{cudnn_path / 'include'}:"
                  f"{os.environ.get('CPATH', '')}\n"
              )
              stream.write(
                  f"LIBRARY_PATH={nccl_path / 'lib'}:"
                  f"{cudnn_path / 'lib'}:"
                  f"{os.environ.get('LIBRARY_PATH', '')}\n"
              )
              stream.write(
                  "LD_LIBRARY_PATH="
                  f"{nccl_path / 'lib'}:"
                  f"{cudnn_path / 'lib'}:"
                  f"{os.environ.get('LD_LIBRARY_PATH', '')}\n"
              )
          print(
              f"torch={torch.__version__} cuda={torch.version.cuda} "
              f"cudnn={observed['nvidia-cudnn-cu13']} "
              f"nccl={observed['nvidia-nccl-cu13']} "
              f"CUDNN_PATH={cudnn_path} NCCL_PATH={nccl_path}"
          )
          PY

      - name: Install build deps
        # scikit-build-core: PEP 517 backend used by tilelang/CMake-based wheels.
        # setuptools-scm: many wheels resolve their version from git tags.
        # numpy must be present for torch's tensor_numpy.cpp at build time.
        # z3-solver: tilelang's CMake calls 'import z3' during configure (FindZ3.cmake).
        # cython: tilelang ships a .pyx module (jit/adapter/cython/cython_wrapper.pyx).
        run: pip install --retries 10 --timeout 60 ninja packaging pybind11 cmake numpy einops scikit-build-core setuptools-scm "z3-solver==4.15.4.0" cython

      - name: Clone source (any ref — branch / tag / SHA)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf src
          REPO_URL="https://github.com/${{ matrix.repo }}.git"
          git clone "$REPO_URL" src
          cd src
          git checkout --detach "${{ steps.src.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "${{ steps.src.outputs.sha }}"
          if [[ "${{ matrix.submodules }}" == "true" ]]; then
            git submodule update --init --recursive --depth 1
          fi
          git log -1 --format='Source HEAD: %h %s'

      - name: Apply patch
        if: matrix.patch
        run: |
          set -euo pipefail
          cd src
          PATCH="$GITHUB_WORKSPACE/${{ matrix.patch }}"
          if git apply --check "$PATCH"; then
            git apply --verbose "$PATCH"
          elif [[ "${{ matrix.name }}" == "flash_attn" ]] && grep -q 'arch=compute_120f,code=sm_120' setup.py; then
            echo "${{ matrix.patch }} is already present in upstream ${{ matrix.repo }}@${{ matrix.ref }}"
          else
            echo "::error::${{ matrix.patch }} does not apply and no known upstream marker was found."
            git apply --check "$PATCH" || true
            exit 1
          fi

      - name: Trim flash_attn FA2 kernel matrix
        # FA2 setup.py has no DISABLE_* knobs — kernel list is hardcoded as
        # 6 hdims × 2 dtypes (fp16/bf16) × 2 causal × 2 (fwd/bwd) = 48 .cu
        # per arch. Even at sm_120 only / MAX_JOBS=1 / NVCC_THREADS=1 this
        # blew the 350-min job timeout three runs in a row.
        # cppmega's training path uses bf16 + hdim 64 (Mamba3) and hdim 128
        # (TE attention). Drop fp16 entirely + drop hdims 32/96/192/256 →
        # 8 .cu files instead of 48, ~6x faster.
        #
        # We must ALSO trim HEADDIM_SWITCH in static_switch.h: the macro
        # expands all 6 hdim if-branches, each referencing run_mha_fwd_<T,
        # hdim, ...>. With kernels missing, those become undefined refs in
        # the .so → ImportError at runtime. Same gotcha as FA3.
        if: matrix.name == 'flash_attn'
        run: |
          set -euo pipefail
          cd src
          # 1) Drop unwanted kernel sources from setup.py's hardcoded list.
          # FA2 has fwd, bwd, AND fwd_split families. The fwd_split is the
          # splitkv path (dispatched at runtime when num_splits > 1, used by
          # mha_fwd_kvcache). cppmega's training only needs num_splits==1
          # fwd+bwd; keeping fwd_split makes the build overflow the 350-min
          # timeout. Drop it AND patch the call site (step 3) so the
          # dispatcher stops referencing run_mha_fwd_splitkv_dispatch<>.
          # Survivors: flash_{fwd,bwd}_hdim{64,128}_bf16{,_causal}_sm80.cu = 8.
          before=$(grep -c '_sm80\.cu' setup.py || true)
          sed -i -E '/csrc\/flash_attn\/src\/flash_(fwd|bwd)_hdim[0-9]+_fp16(_causal)?_sm80\.cu/d' setup.py
          sed -i -E '/csrc\/flash_attn\/src\/flash_(fwd|bwd)_hdim(32|96|192|256)_bf16(_causal)?_sm80\.cu/d' setup.py
          # Upstream renamed this family from fwd_split to fwd_split_align.
          sed -i -E '/csrc\/flash_attn\/src\/flash_fwd_split(_align)?_hdim[0-9]+_(fp16|bf16)(_causal)?_sm80\.cu/d' setup.py
          after=$(grep -c '_sm80\.cu' setup.py || true)
          echo "trimmed $((before - after)) kernel sources ($before → $after)"
          unexpected=$(
            grep '_sm80\.cu' setup.py |
              grep -Ev 'csrc/flash_attn/src/flash_(fwd|bwd)_hdim(64|128)_bf16(_causal)?_sm80\.cu' ||
              true
          )
          if [[ "$after" -ne 8 || -n "$unexpected" ]]; then
            echo "::error::FA2 trim did not leave the exact 8-source training matrix."
            grep '_sm80\.cu' setup.py || true
            exit 1
          fi
          # 2) Restrict HEADDIM_SWITCH to {64,128} and FP16_SWITCH to bf16
          # only. Append #undef + new definitions at end of static_switch.h
          # — any subsequent #include picks up the override. Without these,
          # the original macros expand all 6 hdim and both fp16/bf16
          # branches, generating run_mha_fwd_<T, hdim, ...> references with
          # no matching template instantiation → ImportError on undefined
          # symbol.
          cat >> csrc/flash_attn/src/static_switch.h <<'EOF'

          // cppmega CI trim: kernel sources only include bf16 + hdim 64/128.
          #undef HEADDIM_SWITCH
          #define HEADDIM_SWITCH(HEADDIM, ...)   \
            [&] {                                \
              if (HEADDIM <= 64) {               \
                constexpr static int kHeadDim = 64;  \
                return __VA_ARGS__();            \
              } else if (HEADDIM <= 128) {       \
                constexpr static int kHeadDim = 128; \
                return __VA_ARGS__();            \
              }                                  \
            }()
          #undef FP16_SWITCH
          #define FP16_SWITCH(COND, ...)         \
            [&] {                                \
              using elem_type = cutlass::bfloat16_t; \
              return __VA_ARGS__();              \
            }()
          EOF
          # 3) Disable the splitkv dispatch path in flash_api.cpp. Without
          # this, run_mha_fwd_splitkv_dispatch<T, kHeadDim, IsCausal> is
          # referenced from the dispatcher → undefined symbol in .so since
          # we dropped the splitkv .cu sources. cppmega doesn't use the
          # kvcache path (inference-only), so a runtime check is fine.
          sed -i 's|run_mha_fwd_splitkv_dispatch<elem_type, kHeadDim, Is_causal>(params, stream);|TORCH_CHECK(false, "flash_attn splitkv path disabled in cppmega CI build");|' \
              csrc/flash_attn/flash_api.cpp
          # 4) Keep FA4 out of this wheel. Upstream excludes flash_attn.cute
          # because FA4 ships as the separate flash-attn-4 package with its
          # own nvidia-cutlass-dsl/quack dependency contract. Forcing cute into
          # flash-attn produced an import surface that looked present but
          # failed at runtime against modern CUTLASS Python.
          echo "HEADDIM_SWITCH restricted to {64,128}; splitkv stubbed; survivors:"
          grep '_sm80\.cu' setup.py | sed 's/^/  /'

      - name: Build wheel
        run: |
          set -euo pipefail
          BUILD_DIR="src${{ matrix.subdir && format('/{0}', matrix.subdir) || '' }}"
          mkdir -p wheels logs
          LOG="$GITHUB_WORKSPACE/logs/build-${{ matrix.name }}.log"
          cd "$BUILD_DIR"
          # Tee build output to a file. Runner's per-step blob expires fast
          # (Azure cleanup hits within ~30 min for some jobs); the artifact
          # below keeps it for 30 days regardless.
          env ${{ matrix.extra_env }} \
            pip wheel . --no-build-isolation --no-deps -w "$GITHUB_WORKSPACE/wheels" -v 2>&1 | tee "$LOG"

      - name: Build TileLang-matched TVM FFI wheel
        if: success() && matrix.name == 'tilelang'
        run: |
          set -euo pipefail
          ffi_dir="$GITHUB_WORKSPACE/src/3rdparty/tvm/3rdparty/tvm-ffi"
          test "$(git -C "$ffi_dir" rev-parse HEAD)" = "521efeb30bfd9e4946b248b3d76e6391028233a3"
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_APACHE_TVM_FFI=0.1.13.post5 \
            pip wheel "$ffi_dir" --no-build-isolation --no-deps \
              -w "$GITHUB_WORKSPACE/wheels" -v

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: List wheels
        if: success()
        run: ls -lh wheels/

      - name: Smoke TileLang wheel linkage and import
        if: success() && matrix.name == 'tilelang'
        run: |
          set -euo pipefail
          python -m pip install cloudpickle psutil
          python -m pip install --force-reinstall --no-deps wheels/apache_tvm_ffi-*.whl
          python -m pip install --force-reinstall --no-deps wheels/tilelang-*.whl
          runtime_lib=$(
            python - <<'PY'
          from importlib import metadata

          distribution = metadata.distribution("tilelang")
          matches = [
              item
              for item in distribution.files or ()
              if str(item).endswith("tilelang/lib/libtvm_runtime.so")
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one libtvm_runtime.so, found {matches!r}")
          print(distribution.locate_file(matches[0]))
          PY
          )
          readelf -d "$runtime_lib" | grep -F 'Shared library: [libcuda_stub.so]'
          if readelf -d "$runtime_lib" | grep -Fq 'Shared library: [libcuda.so'; then
            echo "::error::TileLang wheel still links directly to libcuda.so"
            exit 1
          fi
          TVM_FFI_DISABLE_TORCH_C_DLPACK=1 python - <<'PY'
          from importlib import metadata
          import tilelang
          import tvm
          from tvm.s_tir.analysis import is_pure_function

          assert metadata.version("apache-tvm-ffi") == "0.1.13.post5"
          body = tvm.tirx.AttrStmt(
              None, "threadblock_swizzle_pattern", 0, tvm.tirx.Evaluate(0)
          )
          assert body.node is None
          assert is_pure_function(tvm.tirx.PrimFunc([], body))
          print("tilelang", tilelang.__version__, tilelang.__file__)
          PY

      - name: Smoke TransformerEngine wheel ABI
        if: success() && matrix.name == 'transformer_engine'
        run: |
          set -euo pipefail
          python -m pip install pydantic importlib-metadata nvdlfw-inspect onnx onnxscript
          python -m pip install --force-reinstall --no-deps wheels/transformer_engine-*.whl
          python - <<'PY'
          import torch
          import transformer_engine
          import transformer_engine.pytorch

          print("torch", torch.__version__, torch.version.cuda)
          print("transformer_engine", transformer_engine.__version__)
          PY

      - name: Verify Mamba wheel contains the pinned GQA backward patch
        if: success() && matrix.name == 'mamba_ssm'
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          from pathlib import Path
          import zipfile

          wheels = glob.glob("wheels/mamba_ssm-*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected one Mamba wheel, found {wheels!r}")
          required = {
              "mamba_ssm/modules/mamba3.py": (
                  "F.softplus((dd_dt + self.dt_bias).to(torch.float32))"
              ),
              "mamba_ssm/ops/tilelang/mamba3/mamba3_mimo_bwd.py": "elif H % G == 0:",
              "mamba_ssm/ops/tilelang/mamba3/mamba3_mimo_bwd_varlen.py": "elif H % G == 0:",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              for path, marker in required.items():
                  wheel_bytes = archive.read(path)
                  text = wheel_bytes.decode()
                  if marker not in text:
                      raise SystemExit(f"{path} lacks pinned marker {marker!r}")
                  source_bytes = (Path("src") / path).read_bytes()
                  if wheel_bytes != source_bytes:
                      raise SystemExit(
                          f"{path} in wheel differs from patched checkout"
                      )
          PY

      - name: Upload build log (always, even on failure/cancel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.name }}
          path: logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload wheels artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: wheels/*.whl
          retention-days: 7

  release:
    if: github.repository == 'DatasunriseOU/cppmega'
    needs: [resolve, build]
    runs-on: [self-hosted, Linux, X64, cppmega]
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify immutable production wheel set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_WHEEL_TAG: wheels-dbfe51e1b9173e8cc9550c6b269da2c8d20c7f39
          BASE_SOURCE_SHA: dbfe51e1b9173e8cc9550c6b269da2c8d20c7f39
        run: |
          set -euo pipefail
          rm -rf wheels candidate-wheels
          mkdir -p wheels
          read -r tag_type tag_sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${BASE_WHEEL_TAG}" \
              --jq '.object.type + " " + .object.sha'
          )
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$BASE_SOURCE_SHA" ]]; then
            echo "::error::base wheel tag $BASE_WHEEL_TAG is not bound to $BASE_SOURCE_SHA"
            exit 1
          fi
          gh release download "$BASE_WHEEL_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir wheels \
            --pattern '*.whl' \
            --pattern SHA256SUMS
          (
            cd wheels
            sha256sum -c SHA256SUMS
            diff -u \
              <(awk '{print $2}' SHA256SUMS | LC_ALL=C sort) \
              <(printf '%s\n' *.whl | LC_ALL=C sort)
          )

      - name: Download candidate TileLang pair
        uses: actions/download-artifact@v4
        with:
          name: wheel-tilelang
          merge-multiple: true
          path: candidate-wheels

      - name: Overlay exact candidate pair
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidate_all=(candidate-wheels/*.whl)
          candidate_tilelang=(candidate-wheels/tilelang-*.whl)
          candidate_ffi=(candidate-wheels/apache_tvm_ffi-*.whl)
          base_tilelang=(wheels/tilelang-*.whl)
          base_ffi=(wheels/apache_tvm_ffi-*.whl)
          if (( ${#candidate_all[@]} != 2 ||
                ${#candidate_tilelang[@]} != 1 ||
                ${#candidate_ffi[@]} != 1 )); then
            echo "::error::candidate artifact must contain exactly one TileLang wheel and one tvm-ffi wheel"
            find candidate-wheels -maxdepth 1 -type f -print || true
            exit 1
          fi
          if (( ${#base_tilelang[@]} != 1 || ${#base_ffi[@]} != 1 )); then
            echo "::error::immutable base must contain exactly one TileLang wheel and one tvm-ffi wheel"
            find wheels -maxdepth 1 -type f -print || true
            exit 1
          fi
          rm -- wheels/SHA256SUMS "${base_tilelang[0]}" "${base_ffi[0]}"
          install -m 0644 "${candidate_tilelang[0]}" "${candidate_ffi[0]}" wheels/

      - name: List complete candidate wheel set
        run: ls -lh wheels/

      - name: Verify complete candidate wheel set
        run: |
          set -euo pipefail
          shopt -s nullglob
          required=(
            'transformer_engine-*.whl'
            'flash_attn-*.whl'
            'flash_attn_3-*.whl'
            'mamba_ssm-*.whl'
            'causal_conv1d-*.whl'
            'fast_hadamard_transform-*.whl'
            'apache_tvm_ffi-*.whl'
            'tilelang-*.whl'
            'qoptim_cuda-*.whl'
          )
          for pattern in "${required[@]}"; do
            matches=(wheels/$pattern)
            if (( ${#matches[@]} != 1 )); then
              echo "::error::expected exactly one required wheel asset for $pattern, found ${#matches[@]}"
              ls -lh wheels/ || true
              exit 1
            fi
          done
          all_wheels=(wheels/*.whl)
          if (( ${#all_wheels[@]} != ${#required[@]} )); then
            echo "::error::candidate release contains unexpected wheel assets"
            printf '%s\n' "${all_wheels[@]}"
            exit 1
          fi

      - name: Write wheel checksums
        run: |
          set -euo pipefail
          (cd wheels && sha256sum *.whl | LC_ALL=C sort -k2 > SHA256SUMS)
          (cd wheels && sha256sum -c SHA256SUMS)

      - name: Write branch-bound candidate manifest
        env:
          BASE_WHEEL_TAG: wheels-dbfe51e1b9173e8cc9550c6b269da2c8d20c7f39
          BASE_SOURCE_SHA: dbfe51e1b9173e8cc9550c6b269da2c8d20c7f39
          CANDIDATE_CPPMEGA_SHA: ${{ github.sha }}
          CANDIDATE_TILELANG_SHA: a951e3c8a4e2e1092579939d6bc31631ee1a4d8f
          CANDIDATE_TVM_SHA: e25ca6ae50beee0e907b1e5ed32949879caddde1
          CANDIDATE_TVM_FFI_SHA: 521efeb30bfd9e4946b248b3d76e6391028233a3
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          wheel_dir = Path("wheels")
          checksums = {}
          for line in (wheel_dir / "SHA256SUMS").read_text().splitlines():
              digest, filename = line.split(maxsplit=1)
              checksums[filename] = digest
          tilelang = [name for name in checksums if name.startswith("tilelang-")]
          tvm_ffi = [name for name in checksums if name.startswith("apache_tvm_ffi-")]
          if len(tilelang) != 1 or len(tvm_ffi) != 1:
              raise SystemExit(
                  f"candidate manifest expected one TileLang/tvm-ffi pair: "
                  f"tilelang={tilelang!r} tvm_ffi={tvm_ffi!r}"
              )
          manifest = {
              "schema_version": 1,
              "candidate": {
                  "cppmega_ref": os.environ["GITHUB_REF_NAME"],
                  "cppmega_sha": os.environ["CANDIDATE_CPPMEGA_SHA"],
                  "tilelang_sha": os.environ["CANDIDATE_TILELANG_SHA"],
                  "tvm_sha": os.environ["CANDIDATE_TVM_SHA"],
                  "tvm_ffi_sha": os.environ["CANDIDATE_TVM_FFI_SHA"],
              },
              "base_release": {
                  "tag": os.environ["BASE_WHEEL_TAG"],
                  "source_sha": os.environ["BASE_SOURCE_SHA"],
              },
              "github_run": {
                  "id": os.environ["GITHUB_RUN_ID"],
                  "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "url": (
                      f"{os.environ['GITHUB_SERVER_URL']}/"
                      f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                      f"{os.environ['GITHUB_RUN_ID']}"
                  ),
              },
              "candidate_wheels": {
                  tilelang[0]: checksums[tilelang[0]],
                  tvm_ffi[0]: checksums[tvm_ffi[0]],
              },
              "complete_wheel_set": checksums,
          }
          (wheel_dir / "CANDIDATE_MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY
          python3 -m json.tool wheels/CANDIDATE_MANIFEST.json >/dev/null
          sha256sum wheels/CANDIDATE_MANIFEST.json

      - name: Create / update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="wheels-${{ needs.resolve.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "cppmega TileLang candidate wheels ${{ needs.resolve.outputs.tag }}" \
              --notes "Candidate-only complete wheel set: immutable production wheels from dbfe51e1b9173e8cc9550c6b269da2c8d20c7f39 overlaid with TileLang a951e3c8a4e2e1092579939d6bc31631ee1a4d8f (native Bind-role plus fail-closed copy-dependent shared-RMW planning) and its matched tvm-ffi. Do not promote before H200 stage2+GQA and exact 3/3 Mamba gates." \
              --prerelease
          read -r tag_type tag_sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
              --jq '.object.type + " " + .object.sha'
          )
          if [[ "$tag_type" != "commit" || "$tag_sha" != "${{ github.sha }}" ]]; then
            echo "::error::wheel release tag $TAG is not bound to ${{ github.sha }}"
            exit 1
          fi
          gh release upload "$TAG" \
            wheels/*.whl \
            wheels/SHA256SUMS \
            wheels/CANDIDATE_MANIFEST.json \
            --clobber
