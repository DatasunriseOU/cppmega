name: build-image

# Assemble the cppmega runtime image from the prebuilt wheel release and push
# to ghcr.io/datasunriseou/cppmega:<sha>. Buildx registry cache lives in the same
# repo so re-runs after a fix start from the last good layer, never from scratch.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit owning the wheel release to rebuild
        required: false
        type: string
  workflow_run:
    workflows: [build-wheels]
    types: [completed]

permissions:
  contents: read
  packages: write   # ghcr.io push

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/datasunriseou/cppmega

jobs:
  image:
    if: |
      github.repository == 'DatasunriseOU/cppmega' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, Linux, X64, cppmega]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha || github.sha }}

      - name: Verify persistent runner capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          minimum_kib=$((80 * 1024 * 1024))
          if (( available_kib < minimum_kib )); then
            echo "::error::build-image requires at least 80 GiB free on the persistent runner"
            exit 1
          fi

      - name: Resolve wheel release tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $SOURCE_SHA" >&2
            exit 1
          fi
          TAG="wheels-${SOURCE_SHA}"
          read -r tag_type tag_sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
              --jq '.object.type + " " + .object.sha'
          )
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$SOURCE_SHA" ]]; then
            echo "Wheel release tag $TAG is not bound to source $SOURCE_SHA" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Using source $SOURCE_SHA with wheel release $TAG"

      - name: Download wheels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p wheels
          gh release download "${{ steps.rel.outputs.tag }}" --dir wheels \
            --pattern '*.whl' --pattern SHA256SUMS
          (
            cd wheels
            sha256sum -c SHA256SUMS
            diff -u \
              <(awk '{print $2}' SHA256SUMS | LC_ALL=C sort) \
              <(printf '%s\n' *.whl | LC_ALL=C sort)
          )
          ls -lh wheels/

      - name: Verify required wheels
        run: |
          set -euo pipefail
          required=(
            'transformer_engine-*.whl'
            'flash_attn-*.whl'
            'flash_attn_3-*.whl'
            'mamba_ssm-*.whl'
            'causal_conv1d-*.whl'
            'fast_hadamard_transform-*.whl'
            'apache_tvm_ffi-*.whl'
            'tilelang-*.whl'
            'qoptim_cuda-*.whl'
          )
          for pattern in "${required[@]}"; do
            matches=(wheels/$pattern)
            if [[ ! -e "${matches[0]}" ]]; then
              echo "::error::wheel release ${{ steps.rel.outputs.tag }} is missing required asset: $pattern"
              ls -lh wheels/ || true
              exit 1
            fi
          done

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ steps.rel.outputs.source_sha }}
            type=raw,value=${{ steps.rel.outputs.short_sha }}
            type=raw,value=latest,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == github.event.repository.default_branch) || (github.event_name != 'workflow_run' && github.ref_name == github.event.repository.default_branch) }}
            type=raw,value=${{ steps.rel.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.rel.outputs.source_sha }}

      - name: Build & push (cache to/from registry)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false   # cleaner package listing in ghcr UI
