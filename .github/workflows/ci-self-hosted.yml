name: CppMega self-hosted CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cppmega-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-contracts:
    name: macOS model and data contracts
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, cppmega-macos]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run repository-owned macOS lane
        shell: bash
        env:
          CPPMEGA_CI_PYTHON: ${{ vars.CPPMEGA_CI_PYTHON }}
          MEGATRON_LM_REPO: ${{ vars.MEGATRON_LM_REPO }}
          CPPMEGA_MEGATRON_COMMIT: ${{ vars.CPPMEGA_MEGATRON_COMMIT }}
          CPPMEGA_MLX_REFERENCE_ROOT: ${{ vars.CPPMEGA_MLX_REFERENCE_ROOT }}
          CPPMEGA_MLX_REFERENCE_COMMIT: ${{ vars.CPPMEGA_MLX_REFERENCE_COMMIT }}
          CPPMEGA_RECIPE_PARITY_PEER_ROOT: ${{ vars.CPPMEGA_MLX_REFERENCE_ROOT }}
          CPPMEGA_RECIPE_PARITY_PEER_COMMIT: ${{ vars.CPPMEGA_MLX_REFERENCE_COMMIT }}
          CPPMEGA_RECIPE_PARITY_PYTHON: ${{ vars.CPPMEGA_RECIPE_PARITY_PYTHON }}
        run: |
          set -eEuo pipefail
          python_bin="${CPPMEGA_CI_PYTHON:?set repository variable CPPMEGA_CI_PYTHON}"
          receipt_dir="${RUNNER_TEMP}/cppmega-repository-ci-macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pre_python_step="preamble start"
          on_pre_python_error() {
            local exit_code="$?"
            trap - ERR
            mkdir -p "${receipt_dir}"
            printf '{"schema_version": "cppmega.repository-ci.v1", "kind": "lane", "run_id": "%s", "run_attempt": "%s", "lane": "macos-contracts", "status": "failed", "exit_code": %d, "failure_stage": "workflow-preamble", "error": "pre-python preamble failed at step: %s", "steps": []}\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${exit_code}" "${pre_python_step}" \
              > "${receipt_dir}/receipt.json"
            exit "${exit_code}"
          }
          trap 'on_pre_python_error' ERR
          pre_python_step="python_bin is executable"
          test -x "${python_bin}"
          pre_python_step="Triton and MLX packages are local and pinned"
          "${python_bin}" - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sys
          import mlx.core
          import triton

          expected_version = "3.6.0+git5a196a55"
          prefix = Path(sys.prefix).resolve()
          triton_origin = Path(triton.__file__).resolve()
          mlx_origin = Path(mlx.core.__file__).resolve()
          if version("triton") != expected_version or not triton_origin.is_relative_to(prefix):
              raise SystemExit(
                  f"CI Triton must be {expected_version} under {prefix}; found {triton_origin}"
              )
          if not mlx_origin.is_relative_to(prefix):
              raise SystemExit(f"CI MLX must be installed under {prefix}; found {mlx_origin}")
          PY
          pre_python_step="Megatron root and commit are both set"
          : "${MEGATRON_LM_REPO:?set repository variable MEGATRON_LM_REPO}"
          : "${CPPMEGA_MEGATRON_COMMIT:?set repository variable CPPMEGA_MEGATRON_COMMIT}"
          pre_python_step="Megatron checkout matches pinned commit"
          test "$(git -C "${MEGATRON_LM_REPO}" rev-parse HEAD)" = "${CPPMEGA_MEGATRON_COMMIT}"
          pre_python_step="Megatron checkout is clean"
          test -z "$(git -C "${MEGATRON_LM_REPO}" status --porcelain --untracked-files=no)"
          pre_python_step="checkout matches GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          pre_python_step="resolve expected source tree"
          expected_tree="$(git rev-parse HEAD^{tree})"
          if [[ -n "${CPPMEGA_MLX_REFERENCE_ROOT:-}" || -n "${CPPMEGA_MLX_REFERENCE_COMMIT:-}" ]]; then
            pre_python_step="mlx reference root and commit are both set"
            : "${CPPMEGA_MLX_REFERENCE_ROOT:?set both CPPMEGA_MLX_REFERENCE_ROOT and CPPMEGA_MLX_REFERENCE_COMMIT}"
            : "${CPPMEGA_MLX_REFERENCE_COMMIT:?set both CPPMEGA_MLX_REFERENCE_ROOT and CPPMEGA_MLX_REFERENCE_COMMIT}"
            pre_python_step="mlx reference checkout matches pinned commit"
            test "$(git -C "${CPPMEGA_MLX_REFERENCE_ROOT}" rev-parse HEAD)" = "${CPPMEGA_MLX_REFERENCE_COMMIT}"
            pre_python_step="mlx reference worktree is clean"
            test -z "$(git -C "${CPPMEGA_MLX_REFERENCE_ROOT}" status --porcelain --untracked-files=no)"
            pre_python_step="verify tokenizer contract with mlx reference"
            "${python_bin}" "${GITHUB_WORKSPACE}/scripts/data/verify_tokenizer_contract.py" \
              --contract "${GITHUB_WORKSPACE}/data/tokenizer_v2/tokenizer_contract_v1.json" \
              --tokenizer "${GITHUB_WORKSPACE}/data/tokenizer_v2/tokenizer.json" \
              --domain-schema "${GITHUB_WORKSPACE}/data/domain_schema_v1.json" \
              --mlx-root "${CPPMEGA_MLX_REFERENCE_ROOT}"
          else
            pre_python_step="verify tokenizer contract"
            "${python_bin}" "${GITHUB_WORKSPACE}/scripts/data/verify_tokenizer_contract.py" \
              --contract "${GITHUB_WORKSPACE}/data/tokenizer_v2/tokenizer_contract_v1.json" \
              --tokenizer "${GITHUB_WORKSPACE}/data/tokenizer_v2/tokenizer.json" \
              --domain-schema "${GITHUB_WORKSPACE}/data/domain_schema_v1.json"
          fi
          trap - ERR
          "${python_bin}" scripts/ci/run_repository_ci.py lane \
            --lanes-config "${GITHUB_WORKSPACE}/configs/ci/lanes.json" \
            --lane macos-contracts \
            --repo-root "${GITHUB_WORKSPACE}" \
            --receipt-dir "${RUNNER_TEMP}/cppmega-repository-ci-macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --python "${python_bin}" \
            --expected-source-commit "${GITHUB_SHA}" \
            --expected-source-tree "${expected_tree}"
      - name: Surface macOS lane failure receipt in job summary
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/cppmega-repository-ci-macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/receipt.json"
          if [[ -f "${receipt}" ]]; then
            {
              echo "### macOS lane failure receipt"
              echo '```json'
              cat "${receipt}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "macOS lane failed before a receipt.json was written." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload macOS lane receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cppmega-repository-ci-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cppmega-repository-ci-macos-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  linux-portable:
    name: Linux portable data contracts
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, cppmega]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install portable lane dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy pyarrow tokenizers boto3 zstandard
      - name: Run repository-owned Linux lane
        run: |
          set -eEuo pipefail
          receipt_dir="${RUNNER_TEMP}/cppmega-repository-ci-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pre_python_step="preamble start"
          on_pre_python_error() {
            local exit_code="$?"
            trap - ERR
            mkdir -p "${receipt_dir}"
            printf '{"schema_version": "cppmega.repository-ci.v1", "kind": "lane", "run_id": "%s", "run_attempt": "%s", "lane": "linux-contracts", "status": "failed", "exit_code": %d, "failure_stage": "workflow-preamble", "error": "pre-python preamble failed at step: %s", "steps": []}\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${exit_code}" "${pre_python_step}" \
              > "${receipt_dir}/receipt.json"
            exit "${exit_code}"
          }
          trap 'on_pre_python_error' ERR
          pre_python_step="allocate tmpfs test workspace"
          test_tmpdir="$(mktemp -d "/dev/shm/cppmega-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          trap 'rm -rf -- "${test_tmpdir}"' EXIT
          export TMPDIR="${test_tmpdir}"
          pre_python_step="checkout matches GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          pre_python_step="resolve expected source tree"
          expected_tree="$(git rev-parse HEAD^{tree})"
          pre_python_step="verify tokenizer contract"
          python "${GITHUB_WORKSPACE}/scripts/data/verify_tokenizer_contract.py" \
            --contract "${GITHUB_WORKSPACE}/data/tokenizer_v2/tokenizer_contract_v1.json" \
            --tokenizer "${GITHUB_WORKSPACE}/data/tokenizer_v2/tokenizer.json" \
            --domain-schema "${GITHUB_WORKSPACE}/data/domain_schema_v1.json"
          trap - ERR
          python scripts/ci/run_repository_ci.py lane \
            --lanes-config "${GITHUB_WORKSPACE}/configs/ci/lanes.json" \
            --lane linux-contracts \
            --repo-root "${GITHUB_WORKSPACE}" \
            --receipt-dir "${receipt_dir}" \
            --python python \
            --expected-source-commit "${GITHUB_SHA}" \
            --expected-source-tree "${expected_tree}"
      - name: Surface Linux lane failure receipt in job summary
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/cppmega-repository-ci-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/receipt.json"
          if [[ -f "${receipt}" ]]; then
            {
              echo "### Linux lane failure receipt"
              echo '```json'
              cat "${receipt}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Linux lane failed before a receipt.json was written." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload Linux lane receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cppmega-repository-ci-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cppmega-repository-ci-linux-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
