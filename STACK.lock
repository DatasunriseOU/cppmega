# cppmega stack pinning — single source of truth for CI image builds.
# Bump a pin → CI rebuilds only the affected wheel(s) thanks to ccache + buildx cache.

base:
  cuda_image: nvidia/cuda:13.2.1-cudnn-devel-ubuntu24.04@sha256:6435dc5a825b0095648d87a3c91240fd7788a85fafaf215739544d389ab74366
  python: "3.13"
  gcc: "15"           # via ppa:ubuntu-toolchain-r/test; needs nvcc --allow-unsupported-compiler
  # CUDA extension wheels must be built and consumed with the same exact
  # stable CUDA wheel. A floating 2.13.* pin can still make wheel builders and
  # runtime images resolve different artifacts, which breaks TE's C++ ABI.
  torch: "2.13.0+cu132"
  torch_index: https://download.pytorch.org/whl/cu132
  torch_arch_list: "9.0;10.0;12.1"   # H100 / B200 / GB10

# Wheels built on the repository's self-hosted Linux x86_64 runner and uploaded
# to a GH Release as assets.
wheels:
  transformer_engine:
    repo: NVIDIA/TransformerEngine
    ref: 4220403e831d29e93868f7793693ea83f6b8b05b
    version: 2.16
    build: |
      NVTE_FRAMEWORK=pytorch \
        pip wheel . --no-build-isolation -w /wheels
    produces:
      - transformer_engine_torch-*.whl
      - transformer_engine_cu13-*.whl
      - transformer_engine-*.whl

  flash_attn:
    # Public upstream flash-attn wheel is FA2 CUDA kernels only for cppmega.
    # Keep flash_attn.cute excluded: FA4 is installed separately from PyPI as
    # flash-attn-4 with its own CUTLASS/quack dependency contract.
    repo: Dao-AILab/flash-attention
    ref: 060c9188beec3a8b62b33a3bfa6d5d2d44975fab
    patch: upstream_prs/flash_attn_setup_sm120f.patch
    version: 2.8.3
    build: |
      MAX_JOBS=1 NVCC_THREADS=2 \
        pip wheel . --no-build-isolation -w /wheels
    produces:
      - flash_attn-*.whl

  flash_attn_3:
    # FA3 (Hopper) from hopper/ subdir of upstream flash-attention.
    # PACKAGE_NAME=flash_attn_3
    # so it co-installs with flash_attn (FA2/FA4) without conflict. For H100/H200
    # on Modal — useless for B200/GB10 but ships for code parity.
    repo: Dao-AILab/flash-attention
    ref: c75d019dea9d910312974417bc28f190dfdda6d9
    version: 3.x
    subdir: hopper
    build: |
      MAX_JOBS=1 NVCC_THREADS=2 FLASH_ATTENTION_FORCE_BUILD=TRUE \
        pip wheel . --no-build-isolation -w /wheels
    produces:
      - flash_attn_3-*.whl

  mamba_ssm:
    repo: state-spaces/mamba
    ref: 31f3d7baba69d0ccad1635ace1e477367899e408
    patch: upstream_prs/05_mamba3_dt_fp32_gqa_bwd.patch
    version: 2.3.1
    build: |
      MAMBA_FORCE_BUILD=TRUE MAX_JOBS=1 NVCC_THREADS=2 \
        pip wheel . --no-build-isolation -w /wheels
    produces:
      - mamba_ssm-*.whl

  causal_conv1d:
    repo: Dao-AILab/causal-conv1d
    ref: c51519fb10d92ffa257c1982e1831d3243454b2f
    version: 1.6.1
    build: |
      MAX_JOBS=1 NVCC_THREADS=2 \
        pip wheel . --no-build-isolation -w /wheels
    produces:
      - causal_conv1d-*.whl

  fast_hadamard_transform:
    repo: Dao-AILab/fast-hadamard-transform
    ref: e7706faf8d1c3b9f241e36860640ad1dac644ede
    version: 1.1.0
    build: |
      MAX_JOBS=1 NVCC_THREADS=2 \
        pip wheel . --no-build-isolation -w /wheels
    produces:
      - fast_hadamard_transform-*.whl

  tvm_ffi:
    repo: DatasunriseOU/tvm-ffi
    ref: 521efeb30bfd9e4946b248b3d76e6391028233a3
    version: 0.1.13.post5
    build_with: tilelang
    produces:
      - apache_tvm_ffi-*.whl

  tilelang:
    # DatasunriseOU/tilelang fork at de8bb88c carries:
    #   - upstream tile-ai/tilelang#2071 (046b1bd): removes apache-tvm-ffi<0.1.10 cap
    #     → pyproject pin is "apache-tvm-ffi>=0.1.dev0,<0.2" (compatible with FA4 beta23's >=0.1.12)
    #   - vendored TVM submodule bumped to DatasunriseOU/tvm@e25ca6ae, which includes
    #     apache/tvm#18938 (44dbd138d): TVMDerivedObject.__slots__ = ("__dict__", "__weakref__")
    #     → fixes the '_NestedLoopCheckVisitor' object has no attribute '_inst' import crash
    #       under tvm-ffi >=0.1.10 (_ObjectSlotsMeta enforcement).
    #   - restored 3rdparty/nvbench/l2_cache_flush.h at the exact historical
    #     blob still required by TVM's CUDA runtime source.
    #   - lazily imports tvm.testing from the RPC-only ref_count helper, so a
    #     production import does not require the test-only pytest package.
    #   - preserves AttrStmt(node=None) instead of casting it to a null
    #     PrimExpr, preventing Mamba T.use_swizzle TIR purity-analysis SIGSEGVs.
    #   - restores special-scope CUDA declarations for TIRx AllocBuffer nodes,
    #     including WGMMA descriptors and local.var scalars.
    #   - adapts AdjustMatmulOrder's ND axes to this fork's boxed-Integer
    #     permute_dims API (the upstream int64_t form does not compile here).
    #   - links TVM CUDA driver calls through TileLang's lazy libcuda_stub,
    #     including cuFuncGetAttribute required by CUDA 13.2 TVM, so wheel
    #     repair cannot leave libtvm_runtime.so with unresolved cu* symbols.
    #   - vendored tvm-ffi is DatasunriseOU/tvm-ffi@521efeb3
    #     (v0.1.13.post5), matching both FA4's >=0.1.12 contract and the C++
    #     ABI used to link libtvm_runtime.so.
    #   - bodyless Bind roles are classified before rewrite, dependent shared
    #     RMW is planned fail-closed, and fragment owners are selected stably.
    # Upstream tile-ai/tilelang HEAD still caps apache-tvm-ffi<0.1.12 (PR #2373/#2736),
    # so it is NOT usable for the FA4 beta23 image. The fork is the clean path (§4 option 1).
    repo: DatasunriseOU/tilelang
    ref: de8bb88cc382b0e78bc804244f79c4be8cc9e75f
    version: 0.1.9
    submodules: true
    build: |
      pip wheel . --no-build-isolation -w /wheels
    produces:
      - tilelang-*.whl

  qoptim_cuda:
    repo: NVlabs/COAT
    ref: 80ec99f47aaa09231b07ace1fd04c30a1e30ec18
    version: 0.0.0
    subdir: coat/optimizer/kernels
    build: |
      MAX_JOBS=1 NVCC_THREADS=2 \
        pip wheel . --no-build-isolation -w /wheels
    produces:
      - qoptim_cuda-*.whl

runtime_pypi:
  z3_solver:
    # libtilelang is linked to this wheel's libz3.so.4.15 SONAME.
    package: "z3-solver==4.15.4.0"

  apache_tvm_ffi:
    # Final runtime version comes from wheels.tvm_ffi; PyPI v0.1.13 is only
    # the cacheable bootstrap dependency before local wheels are installed.
    package: "apache-tvm-ffi==0.1.13.post5"

  flash_attn_4:
    # FA4 CuTe DSL package. This installs the flash_attn.cute namespace and
    # pins nvidia-cutlass-dsl[cu13]==4.6.0.dev0. Keep quack explicit below:
    # beta23 only declares a lower bound, so leaving it to the resolver makes
    # an otherwise identical image rebuild mutable.
    # H100/H200 training uses FA3; FA4 is kept for the B200/GB10 CuTe path and
    # for cppmega's cute_dsl_mimo modules.
    package: "flash-attn-4[cu13]==4.0.0b23"
    extra_index_url: https://pypi.nvidia.com

  quack_kernels:
    package: "quack-kernels==0.5.3"

# Repos cloned at runtime in the final image (not built as wheels).
sources:
  megatron_lm:
    repo: NVIDIA/Megatron-LM
    ref: ba7b5ebce12af60627a80985792a1449ce45f46c
    install_path: /opt/megatron-lm
    install_mode: editable    # `pip install -e .`
    recovered_patches:
      # Archived under cppmega after the old external fork became unavailable.
      # These are not applied automatically; keep them here as provenance for
      # cppmega-specific Megatron work that is not covered by tagged Core.
      - upstream_prs/megatron/0001-merge-PR-3674-DSA-absorbed-MLA-TileLang-fused-sparse.patch
      - upstream_prs/megatron/0002-cherry-pick-PR-4268-delayed-wgrad-overlap-with-P2P-b.patch

# Final runtime image
image:
  registry: ghcr.io/datasunriseou/cppmega
  buildcache_tag: buildcache
  tags:
    - "{{ git_sha }}"
    - latest
