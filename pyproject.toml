[project]
name = "cppmega"
version = "0.1.0"
description = "Megatron-first CUDA-only rebuild of nanochat feature contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = [
    "datasketch==1.10.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
cppmega = [
    "data/domain_schema_v1.json",
    "megatron/cuda_ext/*.cpp",
    "megatron/cuda_ext/*.cu",
    "megatron/cuda_ext/*.hpp",
    "tokenizer/tokenizer.json",
    "tokenizer/tokenizer_contract_v1.json",
]

[tool.setuptools.packages.find]
include = ["cppmega", "cppmega.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
